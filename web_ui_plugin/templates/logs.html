{% extends "base.html" %}

{% block title %}{{ _("Logs - Vinted Notifications") }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap align-items-center">
    <h1 class="h2">{{ _("Logs") }}</h1>
</div>

<div class="log-toolbar glass-card">
    <div class="log-search">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" id="logSearch" placeholder="{{ _('Search the log') }}" aria-label="{{ _('Search the log') }}" autocomplete="off">
    </div>
    <div class="log-actions">
        <div class="form-check form-switch" title="{{ _('Reload every 5 seconds') }}">
            <input class="form-check-input" type="checkbox" id="logLive" checked>
            <label class="form-check-label" for="logLive">{{ _("Live") }}</label>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="logRefresh" aria-label="{{ _('Refresh now') }}"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
</div>

<div class="segmented log-levels" id="logLevels" role="tablist" aria-label="{{ _('Level') }}">
    <button type="button" class="seg active" data-level="all" role="tab" aria-selected="true">{{ _("All Levels") }}</button>
    {% for level in levels %}
    <button type="button" class="seg" data-level="{{ level }}" role="tab" aria-selected="false">{{ level|title }}<span class="seg-count" data-count="{{ level }}"></span></button>
    {% endfor %}
</div>

<div class="log-meta" id="logMeta" aria-live="polite">{{ _("Loading logs...") }}</div>
<div class="log-list glass-card" id="logList"></div>

<div class="text-center mt-3">
    <button type="button" class="btn btn-outline-secondary" id="logMore" hidden><i class="bi bi-arrow-down-circle me-1"></i> {{ _("Load More") }}</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const PAGE = 50;
        const list = document.getElementById('logList');
        const meta = document.getElementById('logMeta');
        const moreBtn = document.getElementById('logMore');
        const search = document.getElementById('logSearch');
        const live = document.getElementById('logLive');
        let level = 'all';
        let loaded = 0;          // how many rows are on screen
        let total = 0;
        let timer = null;
        let controller = null;

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function row(entry) {
            const item = el('article', 'log-row level-' + entry.level.toLowerCase());
            const head = el('div', 'log-head');
            head.appendChild(el('span', 'log-level', entry.level));
            const time = el('time', 'log-time', entry.timestamp.slice(11));
            time.title = entry.timestamp;
            head.appendChild(time);
            head.appendChild(el('span', 'log-date', entry.timestamp.slice(0, 10)));
            head.appendChild(el('span', 'log-module', entry.module));
            item.appendChild(head);
            const lines = entry.message.split('\n');
            const message = el('pre', 'log-message', entry.message);
            item.appendChild(message);
            // Long messages and tracebacks are folded until tapped
            if (lines.length > 3 || entry.message.length > 240) {
                message.classList.add('folded');
                item.classList.add('foldable');
                item.addEventListener('click', function () {
                    if (window.getSelection().toString()) return;
                    item.classList.toggle('open');
                });
            }
            return item;
        }

        // Fetch `count` rows from the start (used for the first load, filters and live updates)
        async function load(count, append) {
            if (controller) controller.abort();
            controller = new AbortController();
            const offset = append ? loaded : 0;
            const params = new URLSearchParams({level: level, offset: offset, limit: count, q: search.value.trim()});
            try {
                const response = await fetch('/api/logs?' + params, {signal: controller.signal, headers: {'X-Requested-With': 'fetch'}});
                if (response.status === 401) { location.reload(); return; }
                const data = await response.json();
                if (!append) {
                    const scroll = window.scrollY;
                    const open = new Set(Array.from(list.querySelectorAll('.log-row.open')).map(function (r) { return r.dataset.key; }));
                    list.replaceChildren();
                    loaded = 0;
                    data.logs.forEach(function (entry) {
                        const r = row(entry);
                        r.dataset.key = entry.timestamp + entry.module + entry.message.slice(0, 40);
                        if (open.has(r.dataset.key)) r.classList.add('open');
                        list.appendChild(r);
                    });
                    window.scrollTo(0, scroll);
                } else {
                    data.logs.forEach(function (entry) {
                        const r = row(entry);
                        r.dataset.key = entry.timestamp + entry.module + entry.message.slice(0, 40);
                        list.appendChild(r);
                    });
                }
                loaded += data.logs.length;
                total = data.total;
                moreBtn.hidden = !data.has_more;
                if (!loaded) {
                    list.appendChild(el('div', 'empty', vnT('No log entries found')));
                }
                meta.textContent = total ? vnT('%(a)s–%(b)s of %(c)s', {a: 1, b: loaded, c: total}) : '';
                const counts = data.counts || {};
                document.querySelectorAll('[data-count]').forEach(function (badge) {
                    badge.textContent = counts[badge.dataset.count] || '';
                });
            } catch (err) {
                if (err.name === 'AbortError') return;
                meta.textContent = vnT('Error loading logs');
            }
        }

        function schedule() {
            clearInterval(timer);
            if (live.checked) timer = setInterval(function () {
                if (!document.hidden) load(Math.max(PAGE, loaded), false);
            }, 5000);
        }

        document.getElementById('logLevels').addEventListener('click', function (e) {
            const button = e.target.closest('.seg');
            if (!button) return;
            document.querySelectorAll('#logLevels .seg').forEach(function (b) {
                b.classList.toggle('active', b === button);
                b.setAttribute('aria-selected', b === button ? 'true' : 'false');
            });
            level = button.dataset.level;
            load(PAGE, false);
        });
        let debounce = null;
        search.addEventListener('input', function () {
            clearTimeout(debounce);
            debounce = setTimeout(function () { load(PAGE, false); }, 300);
        });
        moreBtn.addEventListener('click', function () { load(PAGE, true); });
        document.getElementById('logRefresh').addEventListener('click', function () { load(Math.max(PAGE, loaded), false); });
        live.addEventListener('change', schedule);

        load(PAGE, false);
        schedule();
    });
</script>
{% endblock %}
