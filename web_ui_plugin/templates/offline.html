{% from "_macros.html" import theme_switch %}<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>{{ _("Offline") }} - Vinted Notifications</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <meta name="theme-color" content="#F2F2F7">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5.1.0/index.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="login-body">
<main class="login-card text-center">
    <div class="login-logo mx-auto"><i class="bi bi-wifi-off"></i></div>
    <h1>{{ _("You are offline") }}</h1>
    <p class="text-muted">{{ _("Vinted Notifications cannot reach the server right now. Check your connection or that the server is running.") }}</p>
    <button type="button" class="btn btn-primary w-100" onclick="location.reload()">{{ _("Try again") }}</button>
</main>
</body>
</html>
